<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modifiers — NPxP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="text-slate-200 min-h-screen">
  <div id="nav"></div>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-extrabold text-white mb-1"><i class="fa-solid fa-temperature-half mr-2 text-emerald-400"></i>Non-Pharmacological Modifiers</h1>
    <p class="text-slate-400 text-sm mb-5">
      Dietary/metabolic, thermal, hypoxic and related interventions. Protocol parameters
      (temperature, concentration, duration, O₂%) are preserved per study — they are never
      normalized away. Click a row for full protocol and linked signatures/interactions.
    </p>

    <div class="flex flex-wrap gap-3 mb-5 items-center">
      <select id="flt-type" class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2">
        <option value="">All types</option>
        <option value="dietary_metabolic">Dietary/metabolic</option>
        <option value="thermal">Thermal</option>
        <option value="hypoxic">Hypoxic</option>
        <option value="mechanical_radiative">Mechanical/radiative</option>
        <option value="other">Other</option>
      </select>
      <input id="flt-q" type="text" placeholder="Search agent…"
             class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 w-72" />
    </div>

    <div id="mod-status" class="text-slate-400 text-sm mb-3"></div>
    <div id="mod-groups"></div>
    <div id="mod-detail" class="mt-8"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/modifiers.js"></script>
</body>
</html>
