[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "npi-pharma"
version = "0.1.0"
description = "Score NPI x pharmaceutical interactions for an individual transcriptome by signature composition (Tier 3, mechanism-only)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "pyyaml>=6",
]

[project.optional-dependencies]
lincs = ["h5py>=3.8"]
sc = ["anndata>=0.10"]
test = ["pytest>=7", "h5py>=3.8"]

[project.scripts]
npi-pharma = "npi_pharma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
npi_pharma = ["data/*.yaml", "data/*.gmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
