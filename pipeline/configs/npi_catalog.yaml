# NPI signature catalog: one record per study / arm / tissue.
#
# Rules
# - Never mix tissues or arms in one record; CR and exercise from the same
#   study are two ids.
# - Fields left null are NOT curated yet. Fill them from the paper / GEO
#   record; do not guess. `ingest-npi` lists every uncurated field, and
#   uncurated duration/intensity/sample_size set quality_flag=unverified_metadata
#   (down-weighted at scoring time).
# - sample_size < 6 paired subjects => quality_flag=small_n unless exploratory: true.
# - inputs.* paths are relative to --raw-dir (default data/raw). inputs.pairing
#   maps GEO "!Sample_characteristics_ch1" keys to pre/post (+ subject for pairing).
#
# Required: npi_id, modality, tissue, species, contrast, source_accessions.

npis:
  - npi_id: LCD_adipose_GSE95640
    modality: diet
    intensity: low_calorie_diet
    duration: null
    tissue: adipose
    species: human
    sample_size: null
    contrast: post-intervention vs baseline, paired
    source_accessions: [GSE95640]
    paper: https://link.springer.com/article/10.1186/s12967-025-07424-z
    notes: Human paired diet signature, previously queried against L1000 (see paper). Milestone NPI.
    inputs:
      series_matrix: GSE95640/GSE95640_series_matrix.txt.gz
      probe_map: GSE95640/probe_map.tsv    # probe<TAB>symbol from the GPL annotation
      pairing: {subject_field: null, time_field: null, pre: null, post: null}

  - npi_id: LCD_adipose_GSE77962
    modality: diet
    intensity: LCD
    duration: null
    tissue: adipose
    species: human
    sample_size: null
    contrast: post-intervention vs baseline, paired, LCD arm
    source_accessions: [GSE77962]
    notes: LCD vs VLCD time course; the arms are separate ids so intensity stays a feature.
    inputs:
      series_matrix: GSE77962/GSE77962_series_matrix.txt.gz
      probe_map: GSE77962/probe_map.tsv
      pairing: {subject_field: null, time_field: null, pre: null, post: null, filter: {}}

  - npi_id: VLCD_adipose_GSE77962
