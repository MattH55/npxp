# Joint NPI x drug transcriptomes: regression references, not NPI signatures.
combination_references:
  - ref_id: CR_x_rapamycin_PMC12078523
    npi: caloric_restriction
    drug: sirolimus
    source: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12078523/
    expectation: joint transcriptome differs from the stronger monotherapy (combo != max(mono))
  - ref_id: fucoxanthin_x_LY294002_PONE2020
    npi: fucoxanthin (nutraceutical)
    drug: LY294002
    source: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0239551

# NPI -> drug mimic retrieval: regression reference for LCD vs L1000.
retrieval_references:
  - ref_id: LCD_adipose_L1000CDS2_mimics
    npi_id: LCD_adipose_GSE95640
    source: https://link.springer.com/article/10.1186/s12967-025-07424-z
    expected_top_hits: null   # curate from the paper's reported L1000CDS2 hits
